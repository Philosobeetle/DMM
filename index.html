<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Mental Math Trainer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#409eff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Math Drill">
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #dcdfe6;
      --text: #303133;
      --subtext: #606266;
      --muted: #909399;
      --primary: #409eff;
      --primary-hover: #66b1ff;
      --success: #67c23a;
      --warning: #e6a23c;
      --danger: #f56c6c;
      --purple: #9b59b6;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #app {
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: 8px;
      padding-bottom: 8px;
    }

    .title { font-size: 24px; font-weight: bold; color: var(--primary); text-align: center; margin: 4px 0 2px; }
    .subtitle { font-size: 13px; color: var(--subtext); text-align: center; margin-bottom: 12px; }
    .badge-bar { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 16px; }

    .btn {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: none;
      background-color: var(--muted);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .btn-primary { background-color: var(--primary); }
    .btn-success { background-color: var(--success); }
    .btn-warning { background-color: var(--warning); }
    .btn-danger { background-color: var(--danger); }
    .btn-purple { background-color: var(--purple); }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .grid-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      border: 2px solid var(--border);
      background-color: var(--card);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      padding: 4px;
      cursor: pointer;
      color: var(--text);
    }
    .grid-cell.selected {
      background-color: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .grid-cell .mark { font-size: 16px; margin-bottom: 2px; }

    .prompt-text { font-size: 34px; font-weight: bold; text-align: center; margin: 16px 0; }
    .answer-text { font-size: 28px; font-weight: bold; color: var(--primary); text-align: center; margin: 8px 0; }
    .status-text { font-size: 15px; color: var(--muted); text-align: center; margin-bottom: 12px; }

    .row { display: flex; gap: 6px; width: 100%; margin-bottom: 8px; flex-wrap: nowrap; }
    .row .btn { flex: 1 1 0; min-width: 0; margin-bottom: 0; font-size: 13px; padding: 10px 4px; }

    .stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      margin-bottom: 10px;
    }
    .stepper-btn {
      width: 34px; height: 36px; border-radius: 8px; border: none;
      background: var(--primary); color: white; font-weight: bold; font-size: 18px;
    }

    input[type="date"], input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      margin-bottom: 10px;
      text-align: center;
    }

    /* BASIC CALCULATOR UI */
    .calc-screen {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: right;
      margin-bottom: 12px;
    }
    .calc-formula { font-size: 14px; color: var(--muted); min-height: 18px; }
    .calc-display { font-size: 32px; font-weight: bold; color: var(--text); overflow-x: auto; }
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .calc-btn {
      padding: 16px 0;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .calc-btn:active { background: var(--border); }
    .calc-btn.op { background: var(--primary); color: white; border: none; }
    .calc-btn.action { background: var(--warning); color: white; border: none; }

    /* STATS UI STYLES */
    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-box .val { font-size: 18px; font-weight: bold; color: var(--primary); }
    .stat-box .lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .stat-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .stat-card-cat { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: var(--bg); color: var(--subtext); }
    .progress-bar {
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
      margin: 4px 0;
    }
    .progress-fill {
      height: 100%;
      background: var(--success);
      border-radius: 3px;
    }
    .stat-card-details {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--subtext);
    }

    /* TUTORIAL & DATE CALCULATOR WORKED SOLUTION CARDS */
    .solution-card {
      background: var(--card);
      border: 1px solid var(--warning);
      border-left: 5px solid var(--warning);
      border-radius: 12px;
      padding: 12px;
      margin: 8px 0;
      text-align: left;
    }
    .solution-header {
      font-weight: bold;
      font-size: 13px;
      color: var(--warning);
      margin-bottom: 8px;
    }
    .solution-step {
      background: var(--bg);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 12px;
      line-height: 1.4;
    }
    .solution-step-title {
      font-weight: bold;
      color: var(--text);
      margin-bottom: 2px;
    }
    .solution-step-body {
      color: var(--subtext);
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
    }
    .solution-answer-box {
      margin-top: 10px;
      padding: 8px 12px;
      background: #f0f9eb;
      border: 1px solid var(--success);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .solution-answer-label {
      font-size: 11px;
      font-weight: bold;
      color: var(--success);
    }
    .solution-answer-val {
      font-size: 18px;
      font-weight: bold;
      color: var(--success);
    }

    .scroll-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
      margin-bottom: 10px;
    }

    .instructions-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      color: var(--subtext);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .spacer { flex: 1; }
  </style>
</head>
<body>
  <div id="app"></div>
  <input type="file" id="import-input" style="display:none" accept=".json" onchange="importData(event)">

  <script>
    // --- APP DATA & SKILLS ---
    const SKILLS = [
      { id: 'day_of_week', category: 'dow', category_name: 'Day of the Week', name: 'What day of the week?' },
      { id: 'vedic_square5', category: 'vedic', category_name: 'Vedic Math', name: 'Square a number ending in 5' },
      { id: 'vedic_nikhilam', category: 'vedic', category_name: 'Vedic Math', name: 'Multiply near base 100 (Nikhilam)' },
      { id: 'vedic_crosswise', category: 'vedic', category_name: 'Vedic Math', name: '2-digit × 2-digit crosswise' },
      { id: 'vedic_complement', category: 'vedic', category_name: 'Vedic Math', name: 'Subtract from power of 10' },
      { id: 'trach_5', category: 'trach', category_name: 'Trachtenberg', name: 'Multiply by 5' },
      { id: 'trach_6', category: 'trach', category_name: 'Trachtenberg', name: 'Multiply by 6' },
      { id: 'trach_7', category: 'trach', category_name: 'Trachtenberg', name: 'Multiply by 7' },
      { id: 'trach_8', category: 'trach', category_name: 'Trachtenberg', name: 'Multiply by 8' },
      { id: 'trach_9', category: 'trach', category_name: 'Trachtenberg', name: 'Multiply by 9' },
      { id: 'trach_11', category: 'trach', category_name: 'Trachtenberg', name: 'Multiply by 11' },
      { id: 'trach_12', category: 'trach', category_name: 'Trachtenberg', name: 'Multiply by 12' },
    ];

    const MONTH_MNEMONICS = {
      1: "WINTER = 6",
      2: "2nd Month = 2",
      3: "March 2 the Beat = 2",
      4: "April FOOLS = 5",
      5: "May0 = 0",
      6: "June BUG = 3",
      7: "Fiver Works 🎉 = 5",
      8: "Capital A = 1",
      9: "FALL = 4",
      10: "TRICKS and TREATS = 6",
      11: "I I / 2urkey Day = 2",
      12: "LAST month = 4"
    };

    const GUIDE = {
      day_of_week: "MONTH CODES:\n• Jan = WINTER = 6 (5 in Leap Year)\n• Feb = 2nd Month = 2 (1 in Leap Year)\n• Mar = March 2 the Beat = 2\n• Apr = April FOOLS = 5\n• May = May0 = 0\n• Jun = June BUG = 3\n• Jul = Fiver Works 🎉 = 5\n• Aug = Capital A = 1\n• Sep = FALL = 4\n• Oct = TRICKS and TREATS = 6\n• Nov = I I / 2urkey Day = 2\n• Dec = LAST month = 4\n\nYEAR CODE:\n(Y + floor(Y/4) + century offset) mod 7.\nCentury offsets: 2000s=0, 1900s=1, 1800s=3, 1700s=5, 1600s=0.\n\nFORMULA:\n(Month Code + Date + Year Code) mod 7.\nResult: 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat, 0=Sun.",
      vedic_square5: "SQUARING NUMBERS ENDING IN 5:\nWrite as (10a + 5).\n1. Multiply leading digit(s) 'a' by (a + 1).\n2. Append '25' to the end.\n\nExample: 65² → 6 × 7 = 42 → 4225.",
      vedic_nikhilam: "MULTIPLY NEAR BASE 100 (NIKHILAM):\n1. Find deviations from 100.\n2. Cross-subtract/add deviation to get left part.\n3. Multiply deviations to get right part.\n\nExample: 97 × 94 (deviations -3, -6) → 97 - 6 = 91; 3 × 6 = 18 → 9118.",
      vedic_crosswise: "URDHVA-TIRYAGBHYAM (2×2 CROSSWISE):\nFor 'ab × cd':\n1. Units digit: b × d (keep units, carry tens)\n2. Tens digit: a×d + b×c + carry\n3. Hundreds: a×c + carry\n\nExample: 32 × 47 → 2×7=14 (write 4, c1); 3×7 + 2×4 + 1 = 30 (write 0, c3); 3×4 + 3 = 15 → 1504.",
      vedic_complement: "ALL FROM 9, LAST FROM 10:\nSubtract every digit from 9, except the last non-zero digit, which you subtract from 10.\n\nExample: 10000 - 4567 = 5433.",
      trach_5: "TRACHTENBERG × 5:\nFor each digit, take half of its right neighbor (rounded down). If current digit is odd, add 5.",
      trach_6: "TRACHTENBERG × 6:\nFor each digit, add digit + half of right neighbor (rounded down) + (5 if digit is odd).",
      trach_7: "TRACHTENBERG × 7:\nDouble current digit + half of right neighbor (rounded down) + (5 if digit is odd).",
      trach_8: "TRACHTENBERG × 8:\nRightmost: (10 - digit) × 2.\nMiddle digits: (9 - digit) × 2 + neighbor.\nLeading zero: neighbor - 2.",
      trach_9: "TRACHTENBERG × 9:\nRightmost: 10 - digit.\nMiddle digits: (9 - digit) + neighbor.\nLeading zero: neighbor - 1.",
      trach_11: "TRACHTENBERG × 11:\nAdd each digit to its right neighbor (with padded leading/trailing zero).",
      trach_12: "TRACHTENBERG × 12:\nDouble each digit, then add its right neighbor."
    };

    const MONTH_NAMES = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    // --- LOCAL STORAGE STATE ---
    let config = {
      num_questions: 5,
      answer_mode: 'manual',
      auto_delay: 5,
      answer_delay: 4,
      selected_skills: SKILLS.map(s => s.id),
      adaptive: false,
      tts_enabled: true,
      tts_rate: 1.0,
      beep_enabled: true,
      handsfree: false
    };

    let stats = JSON.parse(localStorage.getItem('daydrill_stats') || '{}');
    let tutorialProgress = JSON.parse(localStorage.getItem('daydrill_tutorial') || '{}');

    function saveConfig() { localStorage.setItem('daydrill_config', JSON.stringify(config)); }
    function saveStats() { localStorage.setItem('daydrill_stats', JSON.stringify(stats)); }
    function saveTutorial() { localStorage.setItem('daydrill_tutorial', JSON.stringify(tutorialProgress)); }

    const savedConfig = localStorage.getItem('daydrill_config');
    if (savedConfig) { try { config = { ...config, ...JSON.parse(savedConfig) }; } catch(e){} }

    // --- AUDIO & SPEECH UTILS ---
    let audioCtx = null;
    function playBeep() {
      if (!config.beep_enabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e) {}
    }

    function speak(text) {
      if (!config.tts_enabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = config.tts_rate;
      window.speechSynthesis.speak(utter);
    }

    // --- MATH & DATE GENERATORS & EXPLAINERS ---
    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    }

    function getOrdinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function benjaminDayExplain(y, m, d) {
      const mcTable = {1:6, 2:2, 3:2, 4:5, 5:0, 6:3, 7:5, 8:1, 9:4, 10:6, 11:2, 12:4};
      const mcLeap = {1:5, 2:1};
      const centTable = {0:0, 1:5, 2:3, 3:1};

      const leap = isLeapYear(y);
      let mc = (leap && (m === 1 || m === 2)) ? mcLeap[m] : mcTable[m];
      const Y = y % 100;
      const century = Math.floor(y / 100);
      const leaps = Math.floor(Y / 4);
      const offset = centTable[century % 4];
      const totalYc = Y + leaps + offset;
      const yc = totalYc % 7;
      const total = mc + d + yc;
      const code = total % 7;

      const dayName = WEEKDAYS[code];

      let leapExplanation = "";
      if (leap) {
        if (m === 1 || m === 2) {
          leapExplanation = `\n  • ${y} is a LEAP YEAR → ${MONTH_NAMES[m]} code is reduced by 1 (${mcTable[m]} → ${mc}).`;
        } else {
          leapExplanation = `\n  • ${y} is a LEAP YEAR (${MONTH_NAMES[m]} is unaffected; leap rule only alters Jan/Feb).`;
        }
      } else {
        leapExplanation = `\n  • ${y} is a NORMAL YEAR (no leap year adjustments).`;
      }

      const steps = [
        `STEP 1 — LEAP YEAR CHECK & MONTH CODE: ${mc}\n  • Month: ${MONTH_NAMES[m]}\n  • Memory Mnemonic: ${MONTH_MNEMONICS[m]}${leapExplanation}`,
        `STEP 2 — YEAR CODE: ${yc}\n  • Selected Year: ${y}\n  • Last 2 digits (Y): ${Y}\n  • Leap count (Y ÷ 4): ${leaps} (floor division)\n  • Century offset (${century}00s): ${offset}\n  • Calculation: (${Y} + ${leaps} + ${offset}) = ${totalYc} → ${totalYc} mod 7 = ${yc}`,
        `STEP 3 — COMBINE & REDUCE\n  • Month Code (${mc}) + Day (${d}) + Year Code (${yc}) = ${total}\n  • ${total} mod 7 = ${code} → ${dayName}\n  (Weekday index: 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat, 0=Sun)`
      ];
      return { dayName, steps: steps.join('\n\n') };
    }

    function generateExplainer(skillId, prompt) {
      if (skillId === 'day_of_week') {
        const parts = prompt.split('/');
        return benjaminDayExplain(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2])).steps;
      }
      if (skillId === 'vedic_square5') {
        const num = parseInt(prompt.replace('²', ''));
        const a = Math.floor(num / 10);
        const p = a * (a + 1);
        return `STEP 1 — Leading digit(s): ${a}\n\nSTEP 2 — Multiply by (a+1): ${a} × ${a + 1} = ${p}\n\nSTEP 3 — Append 25: ${p}25`;
      }
      if (skillId === 'vedic_nikhilam') {
        const parts = prompt.split(' × ');
        const x = parseInt(parts[0]), y = parseInt(parts[1]);
        const devX = 100 - x, devY = 100 - y;
        const left = x - devY;
        const right = devX * devY;
        return `STEP 1 — Deviations from 100\n  ${x} (-${devX}), ${y} (-${devY})\n\nSTEP 2 — Cross-subtract\n  ${x} - ${devY} = ${left}\n\nSTEP 3 — Multiply deviations\n  ${devX} × ${devY} = ${right}\n\nSTEP 4 — Combine Parts\n  ${left}${right < 10 ? '0' + right : right}`;
      }
      if (skillId === 'vedic_complement') {
        const parts = prompt.split(' − ');
        const base = parseInt(parts[0]), x = parseInt(parts[1]);
        return `STEP 1 — Apply Complement Rule\n  All digits from 9, last nonzero from 10.\n\nSTEP 2 — Subtract\n  ${base} − ${x} = ${base - x}`;
      }
      return GUIDE[skillId] || "Follow the step-by-step mental math rule for this skill.";
    }

    function generateQuestion(skillId) {
      if (skillId === 'day_of_week') {
        const start = new Date(1600, 0, 1).getTime();
        const end = new Date(2099, 11, 31).getTime();
        const randTime = start + Math.random() * (end - start);
        const dt = new Date(randTime);
        const y = dt.getFullYear(), m = dt.getMonth() + 1, d = dt.getDate();
        const res = benjaminDayExplain(y, m, d);
        return {
          prompt: `${y}/${m}/${d}`,
          speakPrompt: `${MONTH_NAMES[m]} ${getOrdinal(d)}, ${y}`,
          answer: res.dayName,
          speakAnswer: res.dayName
        };
      }
      if (skillId === 'vedic_square5') {
        const a = Math.random() < 0.5 ? Math.floor(Math.random()*9)+1 : Math.floor(Math.random()*90)+10;
        const num = a * 10 + 5;
        const ans = num * num;
        return { prompt: `${num}²`, speakPrompt: `${num} squared`, answer: String(ans), speakAnswer: String(ans) };
      }
      if (skillId === 'vedic_nikhilam') {
        const x = Math.floor(Math.random()*15) + 85;
        const y = Math.floor(Math.random()*15) + 85;
        const ans = x * y;
        return { prompt: `${x} × ${y}`, speakPrompt: `${x} times ${y}`, answer: String(ans), speakAnswer: String(ans) };
      }
      if (skillId === 'vedic_crosswise') {
        const x = Math.floor(Math.random()*89) + 11;
        const y = Math.floor(Math.random()*89) + 11;
        const ans = x * y;
        return { prompt: `${x} × ${y}`, speakPrompt: `${x} times ${y}`, answer: String(ans), speakAnswer: String(ans) };
      }
      if (skillId === 'vedic_complement') {
        const d = Math.floor(Math.random()*3) + 2;
        const base = Math.pow(10, d);
        const x = Math.floor(Math.random()*(base - Math.pow(10, d-1) - 1)) + Math.pow(10, d-1) + 1;
        const ans = base - x;
        return { prompt: `${base} − ${x}`, speakPrompt: `${base} minus ${x}`, answer: String(ans), speakAnswer: String(ans) };
      }
      if (skillId.startsWith('trach_')) {
        const k = parseInt(skillId.split('_')[1]);
        const digits = Math.floor(Math.random()*3) + 2;
        const x = Math.floor(Math.random()*(Math.pow(10, digits) - Math.pow(10, digits-1))) + Math.pow(10, digits-1);
        const ans = x * k;
        return { prompt: `${x} × ${k}`, speakPrompt: `${x} times ${k}`, answer: String(ans), speakAnswer: String(ans) };
      }
    }

    // --- SHORTCUTS / URL PARSER ---
    function checkUrlParams() {
      const params = new URLSearchParams(window.location.search);
      if (!params.has('skills') && !params.has('q') && !params.has('start')) return false;

      if (params.has('skills')) {
        const s = params.get('skills').toLowerCase();
        if (s === 'all') {
          config.selected_skills = SKILLS.map(sk => sk.id);
        } else if (s === 'vedic') {
          config.selected_skills = SKILLS.filter(sk => sk.category === 'vedic').map(sk => sk.id);
        } else if (s === 'trach') {
          config.selected_skills = SKILLS.filter(sk => sk.category === 'trach').map(sk => sk.id);
        } else {
          config.selected_skills = s.split(',').map(x => x.trim()).filter(x => SKILLS.some(sk => sk.id === x));
        }
      }

      if (params.has('q')) {
        const q = parseInt(params.get('q'));
        if (q >= 1 && q <= 10) config.num_questions = q;
      }

      if (params.has('mode')) {
        const m = params.get('mode').toLowerCase();
        if (m === 'manual' || m === 'auto') config.answer_mode = m;
      }

      if (params.has('delay')) {
        const d = parseInt(params.get('delay'));
        if (d >= 1 && d <= 30) config.auto_delay = d;
      }

      if (params.has('ans_delay')) {
        const ad = parseInt(params.get('ans_delay'));
        if (ad >= 1 && ad <= 30) config.answer_delay = ad;
      }

      saveConfig();

      if (params.get('start') === 'true' || params.get('start') === '1') {
        startSession();
        return true;
      }
      return false;

          <button class="calc-btn" onclick="calcBtn('3')">3</button>
          <button class="calc-btn op" onclick="calcBtn('+')">+</button>

          <button class="calc-btn" onclick="calcBtn('±')">±</button>
          <button class="calc-btn" onclick="calcBtn('0')">0</button>

    function calcBtn(key) {
      let d = calcState.display;
      let f = calcState.formula;

      if (key === 'C') {
        calcState = { display: '0', formula: '', overwrite: true };
      } else if (key === '⌫') {
        if (!calcState.overwrite && d.length > 1) {
          calcState.display = d.slice(0, -1);
        } else {
          calcState.display = '0';
          calcState.overwrite = true;
        }
      } else if ('0123456789.'.includes(key)) {
        if (key === '.' && d.includes('.') && !calcState.overwrite) return;
        if (calcState.overwrite) {
          calcState.display = key === '.' ? '0.' : key;
          calcState.overwrite = false;
        } else {
          calcState.display = d === '0' && key !== '.' ? key : d + key;
        }
      } else if (key === '±') {
        calcState.display = String(parseFloat(d) * -1);
      } else if (key === '%') {
        calcState.display = String(parseFloat(d) / 100);
      } else if ('+−×÷'.includes(key)) {
        calcState.formula = `${d} ${key} `;
        calcState.overwrite = true;
      } else if (key === '=') {
        if (!f) return;
        const parts = f.trim().split(' ');
        const num1 = parseFloat(parts[0]);
        const op = parts[1];
        const num2 = parseFloat(d);
        let res = 0;
        if (op === '+') res = num1 + num2;
        if (op === '−') res = num1 - num2;
        if (op === '×') res = num1 * num2;
        if (op === '÷') res = num2 !== 0 ? num1 / num2 : 'Error';
        calcState.formula = `${f}${d} =`;
        calcState.display = String(res);
        calcState.overwrite = true;
      }
      renderMathCalc();
    }

          <select id="preset-skills" onchange="updateShortcutPreset('skillPreset', this.value)" style="border:none; font-weight:bold; color:var(--primary); font-size:14px; background:none;">
            <option value="day_of_week" ${shortcutPreset.skillPreset==='day_of_week'?'selected':''}>Day of the Week</option>
            <option value="vedic" ${shortcutPreset.skillPreset==='vedic'?'selected':''}>Vedic Math All</option>
            <option value="trach" ${shortcutPreset.skillPreset==='trach'?'selected':''}>Trachtenberg All</option>
            <option value="all" ${shortcutPreset.skillPreset==='all'?'selected':''}>All 12 Skills</option>
          </select>
        </div>

        <div class="stepper">
          <span>Questions: <b>${shortcutPreset.q}</b></span>
          <div>
            <button class="stepper-btn" onclick="adjustShortcutQ(-1)">−</button>
            <button class="stepper-btn" onclick="adjustShortcutQ(1)">＋</button>
          </div>
        </div>

        <div class="stepper">
          <span>Answer Mode</span>
          <div>
            <button class="btn ${shortcutPreset.mode==='manual'?'btn-primary':''}" style="padding:6px 10px; margin:0 2px; font-size:12px; display:inline-block; width:auto;" onclick="updateShortcutPreset('mode','manual')">Push</button>
            <button class="btn ${shortcutPreset.mode==='auto'?'btn-primary':''}" style="padding:6px 10px; margin:0 2px; font-size:12px; display:inline-block; width:auto;" onclick="updateShortcutPreset('mode','auto')">Auto</button>
          </div>
        </div>

        <div class="stepper">
          <span>Question Timer: <b>${shortcutPreset.delay}s</b></span>
          <div>
            <button class="stepper-btn" onclick="adjustShortcutDelay(-1)">−</button>
            <button class="stepper-btn" onclick="adjustShortcutDelay(1)">＋</button>
          </div>
        </div>

        <div class="stepper">
          <span>Answer Duration: <b>${shortcutPreset.ansDelay}s</b></span>
          <div>
            <button class="stepper-btn" onclick="adjustShortcutAnsDelay(-1)">−</button>
            <button class="stepper-btn" onclick="adjustShortcutAnsDelay(1)">＋</button>
          </div>
        </div>

        <input type="text" readonly id="generated-url" value="${generatedUrl}" onclick="this.select()">

        <button class="btn btn-primary" onclick="copyShortcutUrl('${generatedUrl}')">📋 Copy Link for Shortcuts</button>

        <div class="instructions-card">
          <b>How to add to iOS Shortcuts:</b><br>
          1. Tap <b>Copy Link</b> above.<br>
          2. Open iOS <b>Shortcuts app</b> $\rightarrow$ Tap <b>+</b> (new shortcut).<br>
          3. Tap <b>Add Action</b> $\rightarrow$ Search <b>"Open URLs"</b>.<br>
          4. Paste this copied URL into the action field.<br>
          5. Rename shortcut (e.g., <i>"Quick Math"</i>). You can now ask Siri to run it!
        </div>

        <div class="spacer"></div>
        <button class="btn" onclick="renderHome()">Home</button>
      `;
    }

    function updateShortcutPreset(key, val) {
      shortcutPreset[key] = val;
      renderShortcutsBuilder();
    }

    function adjustShortcutQ(delta) {
      shortcutPreset.q = Math.max(1, Math.min(10, shortcutPreset.q + delta));
      renderShortcutsBuilder();
    }

    function adjustShortcutDelay(delta) {
      shortcutPreset.delay = Math.max(1, Math.min(30, shortcutPreset.delay + delta));
      renderShortcutsBuilder();
    }

    function adjustShortcutAnsDelay(delta) {
      shortcutPreset.ansDelay = Math.max(1, Math.min(30, shortcutPreset.ansDelay + delta));
      renderShortcutsBuilder();
    }

    function copyShortcutUrl(url) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          alert('Link copied to clipboard!');
        }).catch(() => {
          prompt('Copy this link:', url);
        });
      } else {
        prompt('Copy this link:', url);
      }
    }

    function renderStats() {
      let totalAttempts = 0;
      let totalCorrect = 0;
      let totalTime = 0;

      Object.values(stats).forEach(s => {
        totalAttempts += s.attempts || 0;
        totalCorrect += s.correct || 0;
        totalTime += s.total_time || 0;
      });

      const overallAcc = totalAttempts > 0 ? ((totalCorrect / totalAttempts) * 100).toFixed(0) : 0;
      const overallAvgTime = totalAttempts > 0 ? (totalTime / totalAttempts).toFixed(1) : 0;

      let cardsHtml = SKILLS.map(s => {
        const st = stats[s.id];
        if (!st || st.attempts === 0) {
          return `
            <div class="stat-card" style="opacity: 0.6;">
              <div class="stat-card-header">
                <span>${s.name}</span>
                <span class="stat-card-cat">${s.category_name}</span>
              </div>
              <div class="stat-card-details"><span>No attempts recorded yet</span></div>
            </div>`;
        }
        const acc = ((st.correct / st.attempts) * 100).toFixed(0);
        const avg = (st.total_time / st.attempts).toFixed(1);
        const best = st.best_time !== null ? `${st.best_time.toFixed(1)}s` : 'n/a';

        return `
          <div class="stat-card">
            <div class="stat-card-header">
              <span>${s.name}</span>
              <span class="stat-card-cat">${s.category_name}</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${acc}%;"></div></div>
            <div class="stat-card-details">
              <span><b>${acc}%</b> accuracy (${st.correct}/${st.attempts})</span>
              <span>Avg: <b>${avg}s</b> | Best: <b>${best}</b></span>
            </div>
          </div>`;
      }).join('');

      app.innerHTML = `
        <div class="title">My Performance Stats</div>
        <div class="stats-summary">
          <div class="stat-box"><div class="val">${totalAttempts}</div><div class="lbl">Questions</div></div>
          <div class="stat-box"><div class="val">${overallAcc}%</div><div class="lbl">Accuracy</div></div>
          <div class="stat-box"><div class="val">${overallAvgTime}s</div><div class="lbl">Avg Speed</div></div>
        </div>

        <div class="scroll-container">${cardsHtml}</div>

        <div class="row">
          <button class="btn btn-primary" onclick="exportData()">📥 Export Backup</button>
          <button class="btn btn-purple" onclick="triggerImport()">📤 Import Backup</button>
        </div>
        <div class="row">
          <button class="btn btn-danger" onclick="resetStats()">🗑 Reset Stats</button>
          <button class="btn" onclick="renderHome()">Home</button>
        </div>
      `;
    }

    function exportData() {
      const backupData = {
        stats,
        tutorialProgress,
        config,
        exportDate: new Date().toISOString()
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `math_drill_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('import-input').click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.stats) { stats = imported.stats; saveStats(); }
          if (imported.tutorialProgress) { tutorialProgress = imported.tutorialProgress; saveTutorial(); }
          if (imported.config) { config = imported.config; saveConfig(); }
          alert('Backup restored successfully!');
          renderStats();
        } catch(err) {
          alert('Invalid backup file.');
        }
      };
      reader.readAsText(file);
    }

    function resetStats() {
      if (confirm('Clear all recorded statistics?')) {
        stats = {};
        saveStats();
        renderStats();
      }
    }

    function renderSettings() {
      app.innerHTML = `
        <div class="title">Speech Settings</div>
        <button class="btn ${config.tts_enabled ? 'btn-success' : ''}" onclick="toggleTTS()">
          ${config.tts_enabled ? '✓' : '☐'} Read Questions & Answers Aloud
        </button>
        <button class="btn ${config.beep_enabled ? 'btn-success' : ''}" onclick="toggleBeep()">
          ${config.beep_enabled ? '✓' : '☐'} Countdown Beep Tone
        </button>
        <button class="btn" onclick="speak('Speech rate and voice working correctly.')">🔊 Test Speech</button>
        <div class="spacer"></div>
        <button class="btn" onclick="renderHome()">Home</button>
      `;
    }

    function toggleTTS() { config.tts_enabled = !config.tts_enabled; saveConfig(); renderSettings(); }
    function toggleBeep() { config.beep_enabled = !config.beep_enabled; saveConfig(); renderSettings(); }

    // --- SERVICE WORKER REGISTRATION ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    if (!checkUrlParams()) {
      renderHome();
    }
  </script>
</body>
</html>
